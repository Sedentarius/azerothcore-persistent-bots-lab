project:
  id: ac-pbl
  name: AzerothCore Persistent Bots Lab
  repository: Sedentarius/azerothcore-persistent-bots-lab
  status: paused
  language: en-US

scope:
  client_protocol_base: "World of Warcraft 3.3.5a build 12340"
  progression:
    - vanilla
    - tbc
    - wotlk
  domains:
    - agent-based simulation
    - persistent virtual worlds
    - game bots
    - virtual economy
    - navigation
    - group coordination
    - server reliability

research_policy:
  baseline_before_project_interventions: true
  observations_are_experiments: false
  negative_results_are_publishable: true
  raw_data_is_immutable: true
  exact_runtime_exposure_required: true
  exact_upstream_revisions_required_for_results: true
  default_behavior_must_be_measured_before_replacement: true

current:
  phase: baseline_complete_research_paused
  release: null
  realm_stage: null
  active_cohorts: []
  baseline_experiment: EXP-000
  selected_upstream_baseline: upstream/baselines/EXP-000-selected-stack.yaml
  further_experiments_planned: false
  pause_reason: changed_priorities_and_limited_resources

research_sequence:
  - phase: baseline
    experiment: EXP-000
    status: completed_with_limitations
    purpose: characterize a fresh upstream deployment before project-specific patches and behavioral configuration changes
  - phase: intervention
    status: not_planned
    purpose: apply project changes as explicit, reviewable interventions and compare them with the baseline where the comparison is valid
  - phase: persistent_world
    status: not_planned
    purpose: begin longitudinal cohort and world experiments after the intervention build passes QA

documentation:
  agent_guide: AGENTS.md
  methodology: docs/methodology.md
  architecture: docs/system-architecture.md
  research_questions: docs/research-questions.md
  reproducibility: docs/reproducibility.md
  data_model: docs/data-model.md
  glossary: docs/glossary.md
  style_guide: docs/style-guide.md
  licensing: docs/licensing.md

indexes:
  primary: INDEX.yaml
